# Client Import
clientimport.processeslist.notfound=<No LotRO client found>
clientimport.howto.step1=1) Start your 64-bit LOTRO client for Windows (no more 32-bit support).
clientimport.howto.step2=2) Click on the Start Button when:
clientimport.howto.step2a=a) the client is in the character choice panel.
clientimport.howto.step2a.detail=  Then it will import summary data, reputation status, virtues status and crafting status.
clientimport.howto.step2a.limit=  Other data elements are not available at this stage.
clientimport.howto.or=OR
clientimport.howto.step2b=b) the selected character has entered world. Then it will be able to import all the selected data elements.
clientimport.howto.optionA.note=Option a) is fastest to get an overview: select a character then import, select another one, then import...
clientimport.howto.optionB.note=Option b) is slower but it will get all the possible data for the chosen character.
clientimport.howto.vaults=Vaults: data is available only if the vault has been opened just before import. For full import:
clientimport.howto.vaults.detail=Go to a storage NPC. Open the shared vault, the own vault and the wardrobe. Then perform import..
clientimport.howto.housing=Housing: 2 imports are needed for full data. One inside the house and one in the garden.

